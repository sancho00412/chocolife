<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to Chocolife</title>

    <link rel="stylesheet" href="./welcome.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="brand-theme.css">
</head>
<body>

    <header class="welcome-header">
        <a href="welcome.html" class="brand-logo" aria-label="Chocolife home">
            <span class="logo-name">chocolife</span>
            <span class="logo-heart">.me</span>
        </a>
    </header>

    <main class="welcome-main">
        <section class="welcome-content">

            <p class="welcome-eyebrow">DISCOVER · SHOP · ENJOY</p>

            <h1>
                Welcome to<br>
                <span>Chocolife</span>
            </h1>

            <p class="welcome-description">
                Discover the best restaurants, entertainment, wellness
                and lifestyle experiences around you.
            </p>

            <div class="welcome-card">

                <div class="welcome-avatar">
                    <span class="material-symbols-outlined">person</span>
                </div>

                <h2>Welcome!</h2>

                <p>
                    Sign in to your account or create a new one to
                    explore amazing offers.
                </p>

                <div class="welcome-buttons">
                    <a href="login.html" class="welcome-button login-button">
                        Login
                    </a>

                    <a href="register.html"
                       class="welcome-button register-button">
                        Register
                    </a>
                </div>

            </div>
        </section>
    </main>

    

    <script src="./welcome.js"></script>
</body>
</html>
