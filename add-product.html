<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - Chocolife</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link rel="stylesheet" href="./style.css">
    <script src="./theme.js"></script>
</head>

<body>

    <div class="theme-toggler theme-toggler-floating" title="Toggle theme">
        <span class="material-symbols-outlined active">sunny</span>
        <span class="material-symbols-outlined">moon_stars</span>
    </div>

    <div class="container products-container">

        <main>

    <h1>Add Product</h1>

    <p class="text-muted">
        Add a new Chocolife product
    </p>

    <div class="add-product-form">

        <form id="product-form">

            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input
                    type="text"
                    id="product-name"
                    placeholder="Enter product name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="product-number">Product Number</label>
                <input
                    type="text"
                    id="product-number"
                    placeholder="Enter product number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="product-price">Price</label>
                <input
                    type="number"
                    id="product-price"
                    placeholder="Enter price"
                    required
                >
            </div>

            <div class="form-group">
                <label for="product-category">Category</label>
                <select id="product-category" required>
                    <option value="">Select category</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Food">Food</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Travel">Travel</option>
                    <option value="Fitness">Fitness</option>
                </select>
            </div>

            <div class="form-group">
                <label for="product-description">Description</label>
                <textarea
                    id="product-description"
                    placeholder="Enter product description"
                    rows="5"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="product-image">Product Image</label>
                <input
                    type="file"
                    id="product-image"
                    accept="image/*"
                >
            </div>

            <div class="form-group">
                <label for="product-status">Status</label>
                <select id="product-status">
                    <option value="Available">Available</option>
                    <option value="Unavailable">Unavailable</option>
                </select>
            </div>

            <button type="submit" class="add-product-button">
                Add Product
            </button>

        </form>

    </div>

</main>
    </div>
    <script src="add-product.js"></script>

</body>

</html>
